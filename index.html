    experience: function () {
      Object.keys(JOBS).forEach(function (k, i) {
        var j = JOBS[k]; if (i) blank();
        out('<span class="o">' + esc(j.when) + "</span>  " + '<span class="b">' + esc(j.title) + "</span>");
        out('<span class="g">' + esc(j.org) + "</span>");
        j.body.forEach(function (l) { out((l.indexOf("  ") === 0 ? "  " : '<span class="m">•</span> ') + esc(l.trim())); });
      });
    },
    skills: function (a) {
      var q = (a[0] || "").toLowerCase();
      var rows = q ? SKILLS.filter(function (s) { return s[0].indexOf(q) >= 0 || s[0].replace(/_/g, "").indexOf(q.replace(/[^a-z]/g, "")) >= 0; }) : SKILLS;
      if (!rows.length) { out('<span class="rd">skills: no category “' + esc(q) + "”</span>  try: " + SKILLS.map(function (s) { return c("skills " + s[0], s[0]); }).join("  ")); return; }
      out('<span class="m"># skills.yaml</span>');
      rows.forEach(function (s) {
        out('<span class="bl">' + esc(s[0]) + '</span><span class="m">:</span>');
        s[1].split(/,\s*(?![^()]*\))/).forEach(function (t) {
          out("  <span class=\"m\">-</span> " + esc(t));
        });
      });
    },
    education: function () { outLines(fileText("education.txt").map(function (l, i) { return i === 0 ? '<span class="b">' + esc(l) + "</span>" : esc(l); })); },
    stats: function () {
      var rows = [["600+ Gbp", "sequencing data processed"], ["1,078", "genomes analysed"], ["~43 M", "SNPs called (+9.3 M indels)"], ["468", "bacterial genomes, 33 countries"], ["4", "research tools in active use"], ["1,322", "automated tests in G4-WATCH"]];
      rows.forEach(function (r) { out('<span class="o b">' + pad(r[0], 10) + '</span><span class="m">' + esc(r[1]) + "</span>"); });
    },
    contact: function () {
      out('<span class="b">Let\'s talk.</span> <span class="m">Open to bioinformatics engineering roles and research collaborations.</span>');
      blank();
      out(pad("email", 10) + link("mailto:" + EMAIL, EMAIL));
      out(pad("github", 10) + link(GH, "github.com/biocoderep"));
      out(pad("linkedin", 10) + link(LI, "linkedin.com/in/bnpooja"));
      out(pad("location", 10) + "Bengaluru, India");
    },
    ls: function (a) {
      var target = resolve(a.filter(function (x) { return x[0] !== "-"; })[0] || ".");
      var node = FS[target];
      if (!node) { if (fileText(target)) { out(esc(target.split("/").pop())); return; } out('<span class="rd">ls: cannot access \'' + esc(a[0]) + "': No such file or directory</span>"); return; }
      out(node.children.map(function (n) {
        var full = target + "/" + n, isDir = !!FS[full];
        return isDir ? '<span class="dir" data-run="cd ' + esc(rel(full)) + '">' + esc(n) + "/</span>" : '<span class="file" data-run="cat ' + esc(rel(full)) + '">' + esc(n) + "</span>";
      }).join("   "));
    },
    cd: function (a) {
      var t = resolve(a[0] || "~");
      if (!FS[t]) { out('<span class="rd">cd: ' + esc(a[0]) + ": " + (fileText(t) ? "Not a directory" : "No such file or directory") + "</span>"); return; }
      cwd = t; refreshPrompt();
    },
    pwd: function () { out(cwd.replace(/^~/, "/home/pooja")); },
    cat: function (a) {
      if (!a.length) { out('<span class="rd">cat: missing file operand</span>  <span class="m">try</span> ' + c("cat about.txt")); return; }
      a.forEach(function (f) {
        var t = resolve(f), txt = fileText(t);
        if (FS[t]) { out('<span class="rd">cat: ' + esc(f) + ": Is a directory</span>"); return; }
        if (!txt) { out('<span class="rd">cat: ' + esc(f) + ": No such file or directory</span>"); return; }
        txt.forEach(function (l) { out(esc(l)); });
      });
    },
    grep: function (a) {
      var flags = a.filter(function (x) { return x[0] === "-"; }), words = a.filter(function (x) { return x[0] !== "-"; });
      var q = (words[0] || "").replace(/^["']|["']$/g, "");
      if (!q) { out('<span class="rd">usage: grep &lt;word&gt;</span>  <span class="m">e.g.</span> ' + c("grep nextflow") + "  " + c("grep amr")); return; }
      var re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), hits = 0;
      allFiles().forEach(function (path) {
        (fileText(path) || []).forEach(function (l) {
          if (re.test(l)) { hits++; re.lastIndex = 0; out('<span class="file" data-run="cat ' + esc(rel(path)) + '"><span class="g">' + esc(rel(path)) + '</span></span><span class="m">:</span>' + esc(l).replace(re, function (m) { return '<span class="hl">' + m + "</span>"; })); }
          re.lastIndex = 0;
        });
      });
      if (!hits) out('<span class="m">(no matches for “' + esc(q) + '”)</span>');
    },
    open: function (a) {
      var t = (a[0] || "").toLowerCase(), map = { github: GH, linkedin: LI, email: "mailto:" + EMAIL, mail: "mailto:" + EMAIL, };
      if (!map[t]) { out('<span class="rd">open: unknown target “' + esc(a[0] || "") + "”</span>  try: " + ["github", "linkedin", "email"].map(function (x) { return c("open " + x, x); }).join("  ")); return; }
      out('<span class="m">opening</span> ' + link(map[t], map[t]));
      if (t === "email" || t === "mail") location.href = map[t]; else window.open(map[t], "_blank");
    },
    history: function () { hist.forEach(function (h, i) { out('<span class="f">' + pad(String(i + 1), 5) + "</span>" + c(h)); }); },
    clear: function () { while (screen.firstChild && screen.firstChild !== inputLine) screen.removeChild(screen.firstChild); },
    echo: function (a) { out(esc(a.join(" "))); },
    date: function () { out(esc(new Date().toString())); },
    uname: function () { out("PBN-OS 2026 biocoderep x86_64 GNU/Bioinformatics"); },
    exit: function () { out('<span class="m">There is no escape from reproducibility. Try</span> ' + c("contact") + ' <span class="m">instead.</span>'); },
    hire: function (a) { out('<span class="g">✔ Excellent choice.</span> Opening a draft email to Pooja…'); setTimeout(function () { location.href = "mailto:" + EMAIL + "?subject=" + encodeURIComponent("Hello from your terminal portfolio"); }, 600); },
    vim: function () { out('<span class="m">You may never get out. Try</span> ' + c("cat about.txt") + '<span class="m"> instead.</span>'); },
    rm: function () { out('<span class="rd">rm: refusing.</span> <span class="m">Everything here is version-pinned. 🙂</span>'); },
    conda: function () { out('<span class="m">Solving environment: ⠋ …just kidding. Everything here already runs in a container.</span>'); },
    docker: function () { out('<span class="m">CONTAINER ID   IMAGE              STATUS</span>'); out("a1b2c3d4e5f6   biocoderep/pooja   Up 2 years (healthy)"); },
    man: function (a) { out('<span class="m">No manual entry for ' + esc(a[0] || "pooja") + ". Try</span> " + c("help") + '<span class="m">.</span>'); },
    nextflow: function () { out('<span class="m">usage:</span> ' + c("nextflow run pooja")); }
  };
  COMMANDS.ll = COMMANDS.ls; COMMANDS.dir = COMMANDS.ls; COMMANDS.cls = COMMANDS.clear; COMMANDS["?"] = COMMANDS.help;
  COMMANDS.resume = COMMANDS.cv = function () { out('<span class="m">The full CV is available on request:</span> ' + link("mailto:" + EMAIL + "?subject=" + encodeURIComponent("CV request"), EMAIL)); blank(); COMMANDS.stats(); };

  function sudo(a) {
    if (/^hire/i.test(a.join(" "))) return COMMANDS.hire(a.slice(1));
    out('<span class="rd">[sudo] password for guest:</span> <span class="m">********</span>');
    out('guest is not in the sudoers file. <span class="m">This incident will be reported to</span> ' + link("mailto:" + EMAIL, EMAIL) + '<span class="m">. (Or just</span> ' + c("hire pooja") + '<span class="m">.)</span>');
  }

  /* neofetch with a DNA helix */
  function neofetch() {
    var helix = ["A---T", " C--G", "  G-C", "  T-A", " A--T", "G---C", "C----G", "T----A", " A---T", "  G--C", "   C-G", "   A-T", "  T--A", " G---C"];
    var pads = [2, 2, 2, 2, 2, 2, 1, 1, 2, 2, 2, 2, 2, 2];
    var art = helix.map(function (l, i) {
      return " ".repeat(pads[i]) + l.replace(/[ACGT]/g, function (b) { return '<span class="' + b + '">' + b + "</span>"; }).replace(/-+/g, function (d) { return '<span class="f">' + d + "</span>"; });
    }).join("\n");
    var toolCount = SKILLS.reduce(function (n, s) { return n + s[1].split(/,\s*|;\s*/).length; }, 0);
    var info = [
      '<span class="u">pooja</span><span class="m">@</span><span class="h">biocoderep</span>',
      '<span class="f">─────────────────────</span>',
      kv("Role", "Bioinformatics Engineer"),
      kv("Location", "Bengaluru, India"),
      kv("Employer", "ICAR-NIVEDI"),
      kv("Uptime", "2 years of NGS & pipelines"),
      kv("Shell", "bash · python · java"),
      kv("Workflows", "Nextflow DSL2 · Snakemake"),
      kv("Containers", "Docker · Apptainer"),
      kv("Data", "600+ Gbp · 1,078 genomes"),
      kv("Variants", "~43 M SNPs · 9.3 M indels"),
      kv("Packages", toolCount + " (" + '<span class="cmd" data-run="skills">skills</span>' + ")"),
      "",
      '<span class="blocks"><span style="background:#2f7d5b"></span><span style="background:#2f62a3"></span><span style="background:#a16207"></span><span style="background:#b4473a"></span><span style="background:#1a2238"></span><span style="background:#c2410c"></span></span>'
    ].join("\n");
    out('<div class="neo"><pre>' + art + "</pre><pre>" + info + "</pre></div>");
    function kv(k, v) { return '<span class="g b">' + k + '</span><span class="m">:</span> ' + v; }
  }

  /* nextflow run pooja */
  async function nextflow(args) {
    if (args.length && args[0] === "run" && args[1] && args[1].toLowerCase() !== "pooja" && args[1].toLowerCase() !== "biocoderep/pooja") {
      out('<span class="rd">ERROR ~ Cannot find a pipeline named “' + esc(args[1]) + "”</span>  try " + c("nextflow run pooja")); return;
    }
    busy = true; input.disabled = true;
    var names = ["reproducible_insight", "curious_curie", "pinned_pasteur", "tested_turing", "containerised_crick"];
    out('<span class="g b">N E X T F L O W</span>  <span class="m">~  version 24.10.0</span>');
    out('Launching <span class="bl">`biocoderep/pooja`</span> [<span class="o">' + names[Math.random() * names.length | 0] + "</span>] DSL2 - revision: <span class=\"m\">2026</span>");
    blank();
    out('executor &gt;  <span class="b">local</span> (6)');
    var procs = [
      ["QC", "Illumina + Nanopore", "600+ Gbp processed"],
      ["ALIGN_AND_CALL", "28 chromosomes, parallel", "~43 M SNPs · 9.3 M indels"],
      ["HYBRID_ASSEMBLY", "10 breeds", "contig N50 up to 3.9 Mb"],
      ["HPC_WORKFLOW", "bacterial genomics", "468 genomes · 33 countries"],
      ["BUILD_TOOLS", "ICAR-NIVEDI", "4 tools in active use"],
      ["CONTAINERISE", "Docker · Apptainer · CI/CD", "same input → same result"]
    ];
    var rows = procs.map(function (p) { return out(""); });
    function hash() { var h = "0123456789abcdef", s = ""; for (var i = 0; i < 8; i++) s += h[Math.random() * 16 | 0]; return s.slice(0, 2) + "/" + s.slice(2); }
    function render(i, pct, done) {
      var p = procs[i], filled = Math.round(pct / 100 * 12);
      rows[i].innerHTML = '<span class="f">[' + (done ? hash() : "-        ") + ']</span> process &gt; <span class="bl">' + pad(p[0], 16) + '</span><span class="m nfdesc">' + esc(pad("(" + p[1] + ")", 30)) + "</span>" +
        '<span class="bar">' + "■".repeat(filled) + '</span><span class="f">' + "□".repeat(12 - filled) + "</span> " + pad(pct + "%", 5) +
        (done ? '<span class="g">✔</span> <span class="o">' + esc(p[2]) + "</span>" : "");
    }
    procs.forEach(function (_, i) { render(i, 0, false); });
    for (var i = 0; i < procs.length; i++) {
      for (var pct = 0; pct <= 100; pct += 20) { render(i, pct, pct === 100); scrollDown(); await sleep(70); }
    }
    blank();
    out('<span class="g">Duration    :</span> 2y');
    out('<span class="g">Succeeded   :</span> 6');
    out('<span class="g">Cached      :</span> 0  <span class="m">(every run is fully reproducible)</span>');
    blank();
    out('<span class="m">Pipeline output is ready for review →</span> ' + c("projects") + "  " + c("contact"));
    busy = false; input.disabled = false; focusInput();
  }

  /* =========================================================
     HELPERS: paths, completion, fuzzy
     ========================================================= */
  function pad(s, n) { s = String(s); return s + " ".repeat(Math.max(1, n - s.replace(/<[^>]+>/g, "").length)); }
  function resolve(p) {
    if (!p || p === ".") return cwd;
    if (p === "~" || p === "/home/pooja" || p === "/home/pooja/") return "~";
    var base = p.indexOf("~") === 0 ? "~" : p.indexOf("/home/pooja") === 0 ? "~" : cwd;
    var rest = p.replace(/^~\/?/, "").replace(/^\/home\/pooja\/?/, "");
    var parts = base.split("/");
    rest.split("/").forEach(function (seg) { if (!seg || seg === ".") return; if (seg === "..") { if (parts.length > 1) parts.pop(); } else parts.push(seg); });
    return parts.join("/").replace(/\/$/, "");
  }
  function rel(full) { if (full.indexOf(cwd + "/") === 0) return full.slice(cwd.length + 1); return full; }
  function allFiles() {
    var outp = [];
    Object.keys(FS).forEach(function (d) { FS[d].children.forEach(function (n) { var f = d + "/" + n; if (!FS[f]) outp.push(f); }); });
    return outp;
  }
  var ALL_CMDS = ["help", "about", "neofetch", "projects", "project", "experience", "skills", "education", "stats", "contact", "nextflow run pooja", "grep", "ls", "cd", "cat", "pwd", "open", "history", "clear", "whoami", "echo", "date", "hire pooja", "sudo", "exit"];
  function closest(w) {
    var best = null, bd = 3;
    ALL_CMDS.forEach(function (cand) { var cc = cand.split(" ")[0], d = lev(w, cc); if (d < bd) { bd = d; best = cand; } });
    return best;
  }
  function lev(a, b) {
    var m = [], i, j; for (i = 0; i <= b.length; i++) m[i] = [i]; for (j = 0; j <= a.length; j++) m[0][j] = j;
    for (i = 1; i <= b.length; i++) for (j = 1; j <= a.length; j++) m[i][j] = Math.min(m[i - 1][j - 1] + (b[i - 1] === a[j - 1] ? 0 : 1), m[i][j - 1] + 1, m[i - 1][j] + 1);
    return m[b.length][a.length];
  }
  function completions(v) {
    var parts = v.split(" "), last = parts[parts.length - 1];
    if (parts.length === 1) return ALL_CMDS.filter(function (x) { return x.indexOf(v.toLowerCase()) === 0 && v; });
    var cmd = parts[0].toLowerCase(), pool = [];
    if (cmd === "project") pool = Object.keys(PROJECTS);
    else if (cmd === "skills") pool = SKILLS.map(function (s) { return s[0]; });
    else if (cmd === "open") pool = ["github", "linkedin", "email"];
    else if (cmd === "cat" || cmd === "cd" || cmd === "ls") {
      var dirPart = last.indexOf("/") >= 0 ? last.slice(0, last.lastIndexOf("/") + 1) : "", node = FS[resolve(dirPart || ".")];
      if (node) pool = node.children.map(function (n) { var full = resolve(dirPart || ".") + "/" + n; return dirPart + n + (FS[full] ? "/" : ""); });
      if (cmd === "cd") pool = pool.filter(function (p) { return /\/$/.test(p); });
    }
    return pool.filter(function (p) { return p.indexOf(last) === 0; }).map(function (p) { return parts.slice(0, -1).concat(p).join(" "); });
  }
  function updateGhost() {
    var v = input.value, m = v ? completions(v)[0] : null;
    ghost.textContent = m && m !== v ? m : "";
    ghost.style.visibility = m && m !== v ? "visible" : "hidden";
  }

  async function onKey(e) {
    if (busy) { e.preventDefault(); return; }
    if (e.key === "Enter") {
      e.preventDefault(); var v = input.value; input.value = ""; updateGhost();
      busy = true; inputLine.style.visibility = "hidden";
      try { await run(v); } finally { busy = false; inputLine.style.visibility = ""; refreshPrompt(); scrollDown(); focusInput(); }
    } else if (e.key === "Tab") {
      e.preventDefault(); var opts = completions(input.value);
      if (opts.length === 1) { input.value = opts[0] + (/\/$/.test(opts[0]) ? "" : " "); }
      else if (opts.length > 1) {
        var common = opts.reduce(function (a, b) { var i = 0; while (i < a.length && a[i] === b[i]) i++; return a.slice(0, i); });
        if (common.length > input.value.length) input.value = common;
        else { echoCommand(input.value); out(opts.map(function (o) { return '<span class="m">' + esc(o.split(" ").pop()) + "</span>"; }).join("   ")); }
      }
      updateGhost();
    } else if (e.key === "ArrowUp") {
      e.preventDefault(); if (hIdx > 0) { hIdx--; input.value = hist[hIdx]; updateGhost(); }
    } else if (e.key === "ArrowDown") {
      e.preventDefault(); if (hIdx < hist.length - 1) { hIdx++; input.value = hist[hIdx]; } else { hIdx = hist.length; input.value = ""; } updateGhost();
    } else if (e.key === "ArrowRight" && ghost.textContent && input.selectionStart === input.value.length) {
      e.preventDefault(); input.value = ghost.textContent; updateGhost();
    } else if (e.key === "l" && e.ctrlKey) {
      e.preventDefault(); COMMANDS.clear();
    } else if (e.key === "c" && e.ctrlKey && !window.getSelection().toString()) {
      e.preventDefault(); echoCommand(input.value + "^C"); input.value = ""; updateGhost();
    }
  }

  /* click-to-run anywhere */
  async function clickRun(cmd) {
    if (busy) return;
    busy = true; inputLine.style.visibility = "hidden";
    try { await run(cmd); } finally { busy = false; inputLine.style.visibility = ""; refreshPrompt(); scrollDown(); focusInput(); }
  }
  screen.addEventListener("click", function (e) {
    var t = e.target.closest("[data-run]");
    if (t) { e.preventDefault(); clickRun(t.getAttribute("data-run")); return; }
    if (!window.getSelection().toString() && !e.target.closest("a")) focusInput();
  });

  var chips = document.getElementById("chips");
  [["help", 0], ["about", 0], ["projects", 0], ["nextflow run pooja", 1], ["skills", 0], ["experience", 0], ["grep nextflow", 0], ["contact", 0], ["clear", 0]].forEach(function (x) {
    var b = document.createElement("button"); b.textContent = x[0]; if (x[1]) b.className = "hot";
    b.addEventListener("click", function () { clickRun(x[0]); }); chips.appendChild(b);
  });

  /* =========================================================
     BOOT
     ========================================================= */
  async function typeCommand(cmd) {
    var line = out(ps1() + '<span class="typed"></span>', "prompt-line"), span = line.querySelector(".typed");
    for (var i = 0; i < cmd.length; i++) { span.textContent += cmd[i]; await sleep(skip ? 0 : 55 + Math.random() * 40); }
    await sleep(skip ? 0 : 250);
  }
  var skip = false;
  async function boot() {
    makeInputLine();
    inputLine.style.visibility = "hidden"; busy = true;
    var d = new Date();
    out('<span class="m">Last login: ' + esc(d.toDateString()) + " " + d.toTimeString().slice(0, 8) + " on ttys001 from your browser</span>");
    blank();
    var banner = ["█▀▀▄ █▀▀▄ █▄  █", "█▄▄▀ █▀▀▄ █ ▀▄█", "█    █▄▄▀ █   █"];
    out('<pre class="banner">' + esc(banner.join("\n")) + "</pre>");
    blank();
    out("Welcome! I'm <span class=\"b\">Pooja B N</span>, a bioinformatics engineer. This portfolio is a shell.");
    out('<span class="m">Type</span> ' + c("help") + ' <span class="m">to start, click any</span> <span class="cmd">underlined</span> <span class="m">command, or try</span> ' + c("nextflow run pooja") + '<span class="m">.</span>');
    blank();
    await sleep(500);
    await typeCommand("neofetch");
    neofetch();
    busy = false; inputLine.style.visibility = ""; scrollDown(); focusInput();
  }
  document.addEventListener("keydown", function () { if (busy) skip = true; }, { once: true });
  document.getElementById("win").addEventListener("pointerdown", function () { if (busy) skip = true; });
  boot();
})();
</script>
